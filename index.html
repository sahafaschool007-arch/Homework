<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الواجبات - مدارس الصحافة الأهلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#16202b; --muted:#5d6b78; --line:#e3e8ee; --bg:#f3f5f8; --card:#ffffff;
  --brand:#0e4d5c; --brand-2:#13697c; --brand-soft:#e5f1f3;
  --maroon:#8f1d2c; --gold:#c08a1e;
  --good:#1f8f5f; --mid:#d8941a; --bad:#cc3b3b; --none:#9aa5b1;
  --good-soft:#e3f4ec; --mid-soft:#fbf0dc; --bad-soft:#fbe5e5; --none-soft:#eef1f4;
  --r:14px;
  --ff:'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --fh:'Readex Pro', 'IBM Plex Sans Arabic', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ff);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--fh);margin:0;font-weight:600}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 85% -10%, #1b7487 0%, transparent 60%),
             linear-gradient(160deg,#0a3a46 0%,#0e4d5c 55%,#11303a 100%)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:34px 30px 26px;box-shadow:0 30px 70px rgba(0,0,0,.28)}
.login-logos{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.login-logos img{height:62px}
.login-card h1{font-size:22px;color:var(--brand);text-align:center}
.login-card .sub{text-align:center;color:var(--maroon);font-weight:600;margin:4px 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
.input:focus{border-color:var(--brand-2)}
.login-err{color:var(--bad);font-size:13px;min-height:20px;text-align:center}
.foot-note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;transition:transform .05s, background .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-2)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{filter:brightness(1.07)}
.btn-ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}.btn-ghost:hover{border-color:var(--brand-2)}
.btn-danger{background:#fff;color:var(--bad);border:1.5px solid #f1c9c9}.btn-danger:hover{background:var(--bad-soft)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-block{width:100%;justify-content:center;padding:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
.side{width:250px;flex-shrink:0;background:linear-gradient(180deg,#0b3e4a,#0e4d5c 60%,#0c4351);color:#d9eef2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-head{padding:22px 18px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-head img{width:52px;height:44px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.side-head b{display:block;font-family:var(--fh);font-size:16px;color:#fff;line-height:1.3}
.side-head small{color:#9fc9d2;font-size:12px}
.nav{padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#cfe6eb;text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.active{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.nav svg{width:20px;height:20px;flex-shrink:0}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9fc9d2}
.side-foot .btn{width:100%;justify-content:center;background:rgba(255,255,255,.08);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.topbar h2{font-size:20px;color:var(--brand)}
.topbar .grow{flex:1}
.store-pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.store-pill.local{background:var(--mid-soft);color:#8a5b07}
.burger{display:none;background:none;border:0;cursor:pointer;padding:4px}
.content{padding:24px 26px 60px}

/* ---------- Cards / grid ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-size:16px;color:var(--brand);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--brand))}
.kpi .v{font-family:var(--fh);font-size:28px;font-weight:700;color:var(--c,var(--brand));line-height:1.2}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar .grow{flex:1}
.muted{color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-family:var(--fh)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:#f6f8fa;color:var(--muted);font-weight:600;text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #eef1f4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl input.input{padding:6px 8px;min-width:70px}
.tbl .num{text-align:center}
.badge{display:inline-block;white-space:nowrap;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px}
.b-good{background:var(--good-soft);color:var(--good)}
.b-mid{background:var(--mid-soft);color:#9a6408}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-none{background:var(--none-soft);color:#6b7785}

/* ---------- Modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,32,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 14px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:980px;padding:24px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.modal.sm{max-width:520px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h3{color:var(--brand);font-size:19px}
.x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.modal-foot{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16202b;color:#fff;padding:11px 20px;border-radius:12px;z-index:100;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.hint{background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.warn{background:var(--mid-soft);color:#7a4f05}

/* ---------- Report (A4) ---------- */
.report-stage{overflow-x:auto;padding:6px 0 30px}
.page{width:794px;min-height:1123px;margin:0 auto 26px;background:#fff;box-shadow:0 10px 40px rgba(16,40,50,.13);padding:34px 40px 30px;position:relative;font-family:var(--ff);color:var(--ink)}
.rp-head{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;padding-bottom:12px;border-bottom:3px solid var(--brand);position:relative}
.rp-head::after{content:"";position:absolute;bottom:-7px;right:0;left:0;height:1.5px;background:var(--gold)}
.rp-head img{max-height:74px;max-width:110px;justify-self:center}
.rp-head .mid{text-align:center;font-size:13.5px;font-weight:600;line-height:1.75}
.rp-head .mid .sch{color:var(--maroon);font-weight:700}
.rp-head .mid .dep{color:var(--brand)}
.rp-title{text-align:center;margin:26px 0 6px}
.rp-title h1{font-size:25px;color:var(--brand);font-weight:700}
.rp-period{display:flex;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.chip{background:var(--brand-soft);color:var(--brand);padding:4px 14px;border-radius:999px;font-size:13px;font-weight:600}
.chip.g{background:#f8efd9;color:#8a5f0e}
.rp-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:22px 0 14px}
.rk{border:1px solid var(--line);border-radius:12px;padding:11px 8px 10px;text-align:center;background:linear-gradient(180deg,#fff, #fafbfc)}
.rk .ic{width:30px;height:30px;border-radius:9px;margin:0 auto 6px;display:grid;place-items:center;background:var(--c);color:#fff}
.rk .ic svg{width:17px;height:17px}
.rk .v{font-family:var(--fh);font-size:23px;font-weight:700;color:var(--c);line-height:1.25}
.rk .l{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.4}
.rp-summary{background:#f7f9fa;border-right:4px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13.5px;line-height:1.9;margin-bottom:16px}
.rp-sec{display:flex;align-items:center;gap:8px;font-family:var(--fh);color:var(--brand);font-size:15.5px;font-weight:600;margin:14px 0 8px}
.rp-sec::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--gold)}
.rp-duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rp-box{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.rp-box .cap{font-size:12.5px;color:var(--muted);text-align:center;font-weight:600}
.legend-band{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend-band i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:middle}
table.rt{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rt th{background:var(--brand);color:#fff;font-weight:600;padding:7px 6px;text-align:center;line-height:1.35}
.rt td{padding:5px 6px;border-top:1px solid #edf0f3;text-align:center}
.rt td.nm{text-align:right;font-weight:700;color:var(--brand);white-space:nowrap}
.rt td.sb{text-align:right;font-size:11px;color:#46525e}
.rt tr:nth-child(even) td{background:#fafbfc}
.rt tr.tot td{background:var(--maroon)!important;color:#fff;font-weight:700}
.rt .pct{display:inline-block;min-width:56px;padding:2px 6px;border-radius:6px;font-weight:700}
.rp-notes{margin:4px 0 0;padding:0;list-style:none}
.rp-notes li{position:relative;padding:3px 22px 3px 0;font-size:13px;line-height:1.75}
.rp-notes li::before{content:"";position:absolute;right:4px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--maroon)}
.rp-notes b{color:var(--brand)}
.rp-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:18px;text-align:center}
.rp-sign .t{color:var(--maroon);font-weight:700;font-family:var(--fh)}
.rp-sign .n{font-weight:700;margin-top:8px}
.rp-sign .s{margin-top:22px;color:var(--muted);font-size:12px}
.rp-foot{position:absolute;bottom:12px;right:40px;left:40px;display:flex;justify-content:space-between;font-size:10.5px;color:#9aa5b1;border-top:1px solid #eef1f4;padding-top:6px}

.cls-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cls-col h4{font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.cls-col ol{margin:0;padding:0 18px 0 0;font-size:14px;line-height:1.9}
.cls-col .miss{color:var(--bad);font-size:12px;font-weight:600;margin-right:6px;white-space:nowrap;display:inline-block}
.mdet{margin:2px 0 6px;font-size:12.5px}
.mdet summary{cursor:pointer;color:var(--brand-2);font-weight:600;font-size:12px}
.mdet .msub{background:#fbf6f6;border-right:3px solid var(--bad);border-radius:6px;padding:4px 8px;margin-top:4px}
.mdet .msub b{color:var(--maroon);font-size:12px}
.mdet ul{margin:2px 0 0;padding:0 16px 0 0;line-height:1.6;color:#46525e}
.cls-col ol{margin:0;padding:0 18px 0 0;font-size:14px;line-height:1.9}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sp-cls{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;break-inside:avoid}
.sp-cls .hd{display:flex;justify-content:space-between;align-items:center;background:#f3f7f8;padding:6px 10px;border-bottom:1px solid var(--line)}
.sp-cls .hd b{font-family:var(--fh);color:var(--brand);font-size:14px}
.sp-cls .hd span{font-size:11.5px;color:var(--muted);font-weight:600}
.sp-two{display:grid;grid-template-columns:1fr 1fr}
.sp-two>div{padding:6px 10px}
.sp-two>div+div{border-right:1px solid var(--line)}
.sp-two h5{margin:0 0 4px;font-size:12px;font-weight:700}
.sp-two ol{margin:0;padding:0 16px 0 0;font-size:11.5px;line-height:1.75}
.sp-two .miss{color:var(--bad);font-size:10.5px;font-weight:600;white-space:nowrap}
.sp-legend{font-size:11.5px;color:var(--muted);margin:-2px 0 10px}
@media (max-width:1150px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){
  .side{position:fixed;right:0;top:0;z-index:40;transform:translateX(100%);transition:transform .2s}
  .side.open{transform:none}
  .burger{display:block}
  .g2,.g3{grid-template-columns:1fr}
  .content{padding:18px 14px 50px}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

const DATA_FILE = "data.enc.json";
const ENC_ITER = 250000;
const b64e = u8 => { let s = ""; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function encKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:iter, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function encryptData(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await encKey(pass, salt, ENC_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({ app:"sahafa-homework", enc:"AES-GCM/PBKDF2-SHA256", iter:ENC_ITER, salt:b64e(salt), iv:b64e(iv), ct:b64e(ct), exported:new Date().toISOString() });
}
async function decryptData(pkg, pass){
  const key = await encKey(pass, b64d(pkg.salt), pkg.iter || ENC_ITER);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64d(pkg.iv) }, key, b64d(pkg.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function D(v){ const s = String(v ?? ""); return S.settings.digits === "ar" ? s.replace(/[0-9]/g, d => AR_D[d]) : s; }
function pctTxt(p){ return p == null ? "لا توجد" : D(fmt1(p)) + "٪"; }
function fmt1(p){ const r = Math.round(p*10)/10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }

function normName(s){ return String(s||"").replace(/[ً-ْـ]/g,"").replace(/[أإآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g,"").trim(); }

async function initStore(){
  let db = null;
  try{ if(window.claude && typeof window.claude.use === "function") db = await window.claude.use("db"); }catch(e){ db = null; }
  if(db){
    S.db = db; S.mode = "db";
    try{
      const user = await window.claude.use("user");
      if(user && typeof user.can === "function"){ const c = await user.can("data.write"); if(c === false) S.canWrite = false; }
    }catch(e){}
    let loaded = { t:false, w:false, s:false };
    const timer = setTimeout(()=>{ if(!(loaded.t && loaded.w)) toast("تعذّر الوصول إلى البيانات حالياً، قد تكون غير محدّثة", 4000); }, 10000);
    const done = () => { if(loaded.t && loaded.w && loaded.s) clearTimeout(timer); };
    db.collection("teachers").onSnapshot(snap => {
      S.teachers = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if(!snap.metadata.fromCache){ loaded.t = true; done(); }
      rerender();
    }, e => { loaded.t = true; console.warn(e); });
    db.collection("weeks").onSnapshot(snap => {
      S.weeks = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if(!snap.metadata.fromCache){ loaded.w = true; done(); }
      rerender();
    }, e => { loaded.w = true; console.warn(e); });
    Object.values(ROSTER_DOC).forEach(docId => db.doc("config/" + docId).onSnapshot(snap => {
      S.rosters[docId] = snap.exists ? (snap.data().list || []) : [];
      rerender();
    }, e => console.warn(e)));
    db.doc("config/settings").onSnapshot(snap => {
      S.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) };
      if(!snap.metadata.fromCache){ loaded.s = true; done(); }
      rerender();
    }, e => { loaded.s = true; console.warn(e); });
  } else {
    let pkg = null;
    try{ const r = await fetch(DATA_FILE, { cache:"no-store" }); if(r.ok) pkg = await r.json(); }catch(e){ pkg = null; }
    if(pkg && pkg.ct){
      S.mode = "file"; S.enc = pkg;
      let pw = null; try{ pw = sessionStorage.getItem("hw_pw"); }catch(e){}
      if(pw && !(await unlockFile(pw))){ setAuthed(false); }
      updatePill(); if(isAuthed()) showApp(); return;
    }
    S.mode = "local";
    const d = lsLoad();
    if(d){ S.teachers = d.teachers || []; S.weeks = d.weeks || []; S.rosters = d.rosters || (d.students ? { students:d.students } : {}); S.settings = { ...DEFAULT_SETTINGS, ...(d.settings||{}) }; }
  }
  updatePill(); rerender();
}
async function unlockFile(pw){
  try{
    const d = await decryptData(S.enc, pw);
    S.teachers = d.teachers || []; S.weeks = d.weeks || []; S.rosters = d.rosters || {};
    S.settings = { ...DEFAULT_SETTINGS, ...(d.settings||{}) }; S.fileDate = S.enc.exported || "";
    try{ sessionStorage.setItem("hw_pw", pw); }catch(e){}
    return true;
  }catch(e){ return false; }
}
function updatePill(){
  const p = $("#storePill");
  if(S.mode === "file"){ p.textContent = "نسخة منشورة" + (S.fileDate ? " · " + S.fileDate.slice(0,10) : "") + " · التعديلات لا تُحفظ"; p.className = "store-pill local"; return; }
  if(S.mode === "db"){ p.textContent = S.canWrite ? "البيانات محفوظة سحابياً" : "عرض فقط"; p.className = "store-pill"; }
  else { p.textContent = "حفظ محلي على هذا الجهاز"; p.className = "store-pill local"; }
}
function clean(o){ const c = { ...o }; delete c.id; return JSON.parse(JSON.stringify(c)); }
async function writeErr(e){
  console.warn(e);
  if(e && e.code === "invalid_argument"){ S.canWrite = false; updatePill(); toast("ليست لديك صلاحية تعديل البيانات"); }
  else if(e && e.code === "quota_exceeded"){ toast("امتلأت مساحة التخزين، احذف أسابيع قديمة"); }
  else toast("تعذّر الحفظ، حاول مرة أخرى");
  throw e;
}
async function saveDoc(coll, obj){
  if(S.mode === "db"){ try{ await S.db.collection(coll).doc(obj.id).set(clean(obj)); }catch(e){ return writeErr(e); } }
  const arr = coll === "teachers" ? S.teachers : S.weeks;
  const i = arr.findIndex(x => x.id === obj.id); if(i >= 0) arr[i] = obj; else arr.push(obj);
  if(S.mode === "local") lsSave();
}
async function delDoc(coll, id){
  if(S.mode === "db"){ try{ await S.db.collection(coll).doc(id).delete(); }catch(e){ return writeErr(e); } }
  if(coll === "teachers") S.teachers = S.teachers.filter(x => x.id !== id); else S.weeks = S.weeks.filter(x => x.id !== id);
  if(S.mode === "local") lsSave();
}
async function saveSettings(obj){
  if(S.mode === "db"){ try{ await S.db.doc("config/settings").set(JSON.parse(JSON.stringify(obj))); }catch(e){ return writeErr(e); } }
  S.settings = { ...DEFAULT_SETTINGS, ...obj };
  if(S.mode === "local") lsSave();
}

const stageOf = x => x.stage || STAGES[0];
const inStage = x => stageOf(x) === S.stage;
const sortedTeachers = () => S.teachers.filter(inStage).sort((a,b) => (a.order ?? 999) - (b.order ?? 999) || String(a.name).localeCompare(b.name, "ar"));
const sortedWeeks = () => S.weeks.filter(inStage).sort((a,b) => String(b.from||"").localeCompare(String(a.from||"")));
function rowRate(r){ const t = (r.s||0) + (r.n||0); return (r.a && t > 0) ? (r.s||0) / t * 100 : null; }
function weekStats(w){
  const rows = (w.rows || []).map(r => { const t = S.teachers.find(x => x.id === r.tid); return { ...r, name: r.name || (t && t.name) || "", subjects: r.subjects || (t && t.subjects) || "", rate: rowRate(r), has: !!(r.a && r.a > 0) }; });
  const withHw = rows.filter(r => r.has);
  const A = withHw.reduce((s,r)=>s+(r.a||0),0), Sb = withHw.reduce((s,r)=>s+(r.s||0),0), Nn = withHw.reduce((s,r)=>s+(r.n||0),0);
  const rate = (Sb+Nn) > 0 ? Sb/(Sb+Nn)*100 : null;
  return { rows, withHw, without: rows.filter(r => !r.has), teachers: rows.length, assigned: withHw.length, A, S:Sb, N:Nn, rate };
}
function autoNotes(w){
  const st = weekStats(w); const out = [];
  const byRate = [...st.withHw].filter(r=>r.rate!=null).sort((a,b)=>b.rate-a.rate);
  if(byRate.length){
    out.push({ label:"الأعلى في نسبة التسليم", text: byRate.slice(0,3).map(r => `${r.name} ${pctTxt(r.rate)}`).join("، ") + "." , tone:"good"});
  }
  const maxA = Math.max(0, ...st.withHw.map(r=>r.a||0));
  if(maxA > 0){
    const tops = st.withHw.filter(r => r.a === maxA).map(r=>r.name);
    out.push({ label:"الأكثر إسناداً للواجبات", text: `${tops.join("، ")} بعدد ${D(maxA)} ${maxA>=3&&maxA<=10?"واجبات":"واجباً"}.`, tone:"brand" });
  }
  const low = byRate.filter(r => r.rate < S.settings.lo).sort((a,b)=>a.rate-b.rate);
  if(low.length) out.push({ label:"بحاجة إلى متابعة لرفع نسبة التسليم", text: low.map(r => `${r.name} ${pctTxt(r.rate)}`).join("، ") + ".", tone:"bad" });
  if(st.without.length) out.push({ label:"لم تُسجَّل لهم واجبات خلال الفترة", text: st.without.map(r=>r.name).join("، ") + ".", tone:"mid" });
  out.push({ label:"التوصية", text: "متابعة الطلاب غير المسلِّمين مع أولياء الأمور" + (st.without.length ? "، وتوجيه المعلمين الذين لم يسندوا واجبات إلى تفعيلها وفق خطة القسم." : ".") , tone:"maroon" });
  return out;
}
function notesFor(w){
  if(w.notesText && w.notesText.trim()){
    return w.notesText.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
      const i = l.indexOf(":"); return i > 0 ? { label:l.slice(0,i).trim(), text:l.slice(i+1).trim(), tone:"brand" } : { label:"", text:l, tone:"brand" };
    });
  }
  return autoNotes(w);
}
const notesToText = arr => arr.map(n => n.label ? `${n.label}: ${n.text}` : n.text).join("\n");

const CH = {};

function chartSetup(){
  if(!window.Chart) return;

}
const centerText = {
  id:"centerText",
  afterDraw(c, a, opts){
    if(!opts || !opts.text) return;
    const { ctx, chartArea:{left,right,top,bottom} } = c;
    const meta = c.getDatasetMeta(0).data[0]; if(!meta) return;
    ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.direction="rtl";
    ctx.fillStyle = opts.color || "#0e4d5c";
    ctx.font = `700 ${opts.size||30}px 'Readex Pro', sans-serif`;
    const y = opts.half ? meta.y - (opts.size||30)*0.45 : meta.y;
    ctx.fillText(opts.text, meta.x, y);
    if(opts.sub){ ctx.font = `600 12px 'IBM Plex Sans Arabic', sans-serif`; ctx.fillStyle="#5d6b78"; ctx.fillText(opts.sub, meta.x, y + (opts.size||30)*0.75); }
    ctx.restore();
  }
};
const thresholdLines = {
  id:"thresholdLines",
  afterDatasetsDraw(c, a, opts){
    if(!opts || !opts.values) return;
    const x = c.scales.x, { top, bottom } = c.chartArea, ctx = c.ctx;
    opts.values.forEach(v => {
      const px = x.getPixelForValue(v.v);
      ctx.save(); ctx.strokeStyle = v.color; ctx.setLineDash([5,4]); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = v.color; ctx.font = "600 10.5px 'IBM Plex Sans Arabic'"; ctx.textAlign = "center";
      ctx.fillText(D(v.v) + "٪", px, top - 4); ctx.restore();
    });
  }
};

      <tbody>${draft.rows.map((r,i) => `<tr data-i="${i}">

      <div class="row" style="margin-top:10px">

    $$("tr[data-i] input", root).forEach(inp => inp.addEventListener("input", () => {
      const tr = inp.closest("tr"), r = draft.rows[+tr.dataset.i], k = inp.dataset.k;
      r[k] = k === "subjects" ? inp.value : num(inp.value);
      $("[data-rate]", tr).innerHTML = badge(r.a ? rowRate(r) : null);
    }));
    $$("[data-rm]", root).forEach(b => b.onclick = () => { sync(); draft.rows.splice(+b.dataset.rm, 1); draw(); });
    $("#addT").onchange = e => { const t = S.teachers.find(x => x.id === e.target.value); if(!t) return; sync(); draft.rows.push({ tid:t.id, name:t.name, subjects:t.subjects||"", a:null, s:null, n:null }); draw(); };
    $("#pasteApply").onclick = () => {
      sync();
      const lines = $("#pasteBox").value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let ok = 0, miss = [];
      lines.forEach(l => {
        const parts = l.split(/\t|,|،|;/).map(x => x.trim()).filter(x => x !== "");
        if(parts.length < 2) return;
        const nameIdx = parts.findIndex(p => num(p) == null && p !== "—" && p !== "-");
        if(nameIdx < 0) return;
        const name = parts[nameIdx]; const nums = parts.filter((p,i) => i !== nameIdx).map(num).filter(x => x != null);
        const key = normName(name);
        let row = draft.rows.find(r => normName(r.name) === key) || draft.rows.find(r => normName(r.name).includes(key) || key.includes(normName(r.name)));
        if(!row){
          const t = S.teachers.find(t => normName(t.name) === key);
          if(t){ row = { tid:t.id, name:t.name, subjects:t.subjects||"", a:null,s:null,n:null }; draft.rows.push(row); }
        }
        if(!row){ miss.push(name); return; }
        row.a = nums[0] ?? null; row.s = nums[1] ?? null; row.n = nums[2] ?? null; ok++;
      });
      draw();
      $("#pasteMsg").textContent = `تم تطبيق ${D(ok)} صف` + (miss.length ? ` · لم يُعرف: ${miss.join("، ")} (أضفهم من صفحة المعلمين)` : "");
      $("details", root).open = true;
    };
    $$("[data-close]", root).forEach(b => b.onclick = closeModal);
    $("#wSave").onclick = async () => {
      sync();
      if(!draft.title){ toast("اكتب عنوان الأسبوع"); return; }
      if(!draft.from || !draft.to){ toast("حدّد تاريخ بداية ونهاية الفترة"); return; }
      const bad = draft.rows.find(r => r.a && ((r.s==null) || (r.n==null)));
      if(bad){ toast(`أكمل المسلَّم وغير المسلَّم للمعلم: ${bad.name}`); return; }
      draft.updatedAt = new Date().toISOString();
      $("#wSave").disabled = true;
      try{ await saveDoc("weeks", draft); S.selWeek = draft.id; toast("تم حفظ بيانات الأسبوع"); closeModal(); }catch(e){ $("#wSave").disabled = false; }
    };
  };
  draw();
}

const GRADE_ORD = {"الأول":1,"الثاني":2,"الثالث":3,"الرابع":4,"الخامس":5,"السادس":6};
function clsKey(c){ const p = String(c).split("-"); return (GRADE_ORD[p[0].trim()]||9)*100 + (p[1] ? p[1].trim().charCodeAt(0)%100 : 0); }
function weekClasses(w){
  const roster = S.rosters[ROSTER_DOC[stageOf(w)] || "students"] || [];
  if(!Array.isArray(w.stu) || !roster.length) return null;
  const by = {};
  const hs = w.hs || [], hw = w.hw || [], mm = w.miss || {};
  const missList = i => (mm[i] || []).map(h => hw[h]).filter(Boolean).map(([s,tl]) => ({ subj: hs[s] || "", title: tl }));
  w.stu.forEach(([i,a,d]) => { const st = roster[i]; if(!st || !a) return; (by[st[1]] = by[st[1]] || []).push({ name:st[0], a, d, miss:a-d, missed: missList(i) }); });
  return Object.keys(by).sort((x,y) => clsKey(x)-clsKey(y)).map(cls => {
    const list = by[cls].sort((p,q) => p.name.localeCompare(q.name,"ar"));
    const done = list.filter(s => s.miss === 0);
    const notDone = list.filter(s => s.miss > 0).sort((p,q) => q.miss-p.miss || p.name.localeCompare(q.name,"ar"));
    const A = list.reduce((s,x)=>s+x.a,0), Dn = list.reduce((s,x)=>s+x.d,0);
    return { cls, list, done, notDone, A, Dn, rate: A ? Dn/A*100 : null };
  });
}
const missTxt = s => `لم يحل ${D(s.miss)} من ${D(s.a)}`;
function missedHTML(s){
  if(!s.missed || !s.missed.length) return "";
  const bySubj = {}; s.missed.forEach(m => (bySubj[m.subj] = bySubj[m.subj] || []).push(m.title));
  return `<details class="mdet"><summary>الواجبات غير المحلولة</summary>${Object.entries(bySubj).map(([sj, ts]) => `<div class="msub"><b>${esc(sj||"—")}</b><ul>${ts.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</details>`;
}

      </div></div>`).join("")}</div>`;
  bindWeekSelect("swSel");
  $("#clsSel").onchange = e => { S.selClass = e.target.value; render(); };

  clsChart("cCls", cl, false);

function clsChart(id, cl, report){
  return mkChart(id, { type:"bar",
    data:{ labels: cl.map(c => c.cls), datasets:[{ data: cl.map(c => c.rate==null?0:+c.rate.toFixed(1)), backgroundColor: cl.map(c => BAND_COLOR[band(c.rate)]), borderRadius:5, barThickness: report?14:18 }] },
    options:{ indexAxis:"y", maintainAspectRatio:false, animation: report?false:undefined, devicePixelRatio: report?2.5:undefined, layout:{padding:{top:6}},
      plugins:{ legend:{display:false}, tooltip:{ rtl:true, callbacks:{ label:c => " " + D(fmt1(c.parsed.x)) + "٪" } },
        datalabels:{ display:true, anchor:"end", align:"left", offset:4, color:"#fff", font:{weight:700, size: report?10.5:12}, formatter:v => D(fmt1(v))+"٪" } },
      scales:{ x:{ min:0, max:100, reverse:true, grid:{color:"#eef1f4"}, ticks:{ callback:v => D(v)+"٪", font:{size:10} } },
               y:{ position:"right", grid:{display:false}, ticks:{ font:{ size: report?11:12.5, weight:600 }, color:"#16202b" } } } } });
}
function studentPagesHTML(w, cl){
  // pack class blocks into A4 pages by estimated height
  const CAP = 880, FIRST_EXTRA = 110 + cl.length*24 + 40;
  const blockH = c => 46 + Math.max(c.done.length, c.notDone.length, 1) * 20;
  const pages = []; let cur = [], h = FIRST_EXTRA;
  cl.forEach(c => { const bh = blockH(c); if(cur.length && h + bh > CAP){ pages.push(cur); cur = []; h = 40; } cur.push(c); h += bh; });
  if(cur.length) pages.push(cur);
  const block = c => `<div class="sp-cls"><div class="hd"><b>فصل ${esc(c.cls)}</b><span>${D(c.list.length)} طالباً · المنجزون ${D(c.done.length)} · غير المنجزين ${D(c.notDone.length)} · نسبة الحل ${pctTxt(c.rate)}</span></div>
    <div class="sp-two"><div><h5 style="color:#1f8f5f">المنجزون</h5>${c.done.length?`<ol>${c.done.map(s=>`<li>${esc(s.name)}</li>`).join("")}</ol>`:'<span class="muted" style="font-size:11.5px">لا يوجد</span>'}</div>
    <div><h5 style="color:#cc3b3b">غير المنجزين</h5>${c.notDone.length?`<ol>${c.notDone.map(s=>`<li>${esc(s.name)} <span class="miss">(${missTxt(s)})</span></li>`).join("")}</ol>`:'<span class="muted" style="font-size:11.5px">لا يوجد</span>'}</div></div></div>`;
  return pages.map((pg, i) => `<div class="page sp-page">${reportHeader()}
    ${i===0 ? `<div class="rp-sec" style="margin-top:18px">حصر الطلاب المنجزين وغير المنجزين حسب الفصل</div>
      <div class="sp-legend">المنجز: من حلّ جميع الواجبات المسندة إليه خلال الأسبوع. غير المنجز: من لم يحل واجباً واحداً على الأقل.</div>
      <div style="height:${cl.length*24+30}px"><canvas id="rCls"></canvas></div>` : `<div style="height:16px"></div>`}
    ${pg.map(block).join("")}
    __FOOT__</div>`);
}

async function getDownloads(){ try{ return (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){ return null; } }
async function offerFile(filename, data){
  const dl = await getDownloads();
  if(!dl){
    try{
      const blob = data instanceof Blob ? data : new Blob([data], { type:"application/octet-stream" });
      const url = URL.createObjectURL(blob); const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast("تم تجهيز الملف");
    }catch(e){ toast("تعذّر تحميل الملف"); }
    return;
  }
  try{ await dl.save({ filename, data }); toast("تم تجهيز الملف"); }
  catch(e){ if(e && e.code === "declined") toast("تم إلغاء التحميل"); else if(e && e.code === "rate_limited") toast("انتظر قليلاً ثم أعد المحاولة"); else toast("تعذّر تحميل الملف"); }
}
async function exportPDF(w){
  if(!window.html2canvas || !window.jspdf){ toast("مكتبات PDF لم تُحمَّل، أعد تحميل الصفحة"); return; }
  const btn = $("#pdfBtn"); btn.disabled = true; btn.textContent = "جارٍ التجهيز…";
  try{
    const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit:"mm", format:"a4", orientation:"portrait" });
    const pages = $$(".page", $("#reportStage"));
    for(let i=0;i<pages.length;i++){
      const el = pages[i];
      const canvas = await html2canvas(el, { scale:2.2, backgroundColor:"#ffffff", useCORS:true, logging:false, windowWidth: 1200 });
      const img = canvas.toDataURL("image/jpeg", 0.93);
      let wmm = 210, hmm = canvas.height * 210 / canvas.width;
      if(hmm > 297){ wmm = wmm * 297 / hmm; hmm = 297; }
      if(i > 0) pdf.addPage();
      pdf.addImage(img, "JPEG", (210 - wmm)/2, 0, wmm, hmm);
    }
    const blob = pdf.output("blob");
    await offerFile(`تقرير الواجبات - ${w.title || "أسبوع"}.pdf`, blob);
  }catch(e){ console.error(e); toast("حدث خطأ أثناء إنشاء PDF"); }
  btn.disabled = false; btn.textContent = "تحميل PDF";
}
async function exportXLSX(w){
  if(!window.XLSX){ toast("مكتبة Excel لم تُحمَّل"); return; }
  const st = weekStats(w);
  const aoa = [
    [S.settings.school + " - " + S.settings.dept],
    [`تقرير الواجبات لمعلمي ${stageOf(w)} - ${w.title||""}`],
    [`الفترة من ${w.from} إلى ${w.to}`], [],
    ["م","اسم المعلم","المادة والصفوف","عدد الواجبات","المسلم","غير المسلم","نسبة التسليم %"],
    ...st.rows.map((r,i) => [i+1, r.name, r.subjects||"", r.has?r.a:"—", r.has?(r.s||0):"—", r.has?(r.n||0):"—", r.has&&r.rate!=null?+r.rate.toFixed(1):"لا توجد"]),
    ["", "الإجمالي", "", st.A, st.S, st.N, st.rate!=null?+st.rate.toFixed(1):""]
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:5},{wch:24},{wch:46},{wch:12},{wch:10},{wch:11},{wch:14}];
  ws["!views"] = [{ RTL:true }];
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views:[{ RTL:true }] };
  XLSX.utils.book_append_sheet(wb, ws, "التقرير");
  const cl = weekClasses(w);
  if(cl && cl.length){
    const rows2 = [["الفصل","اسم الطالب","الواجبات المسندة","المحلولة","غير المحلولة","الحالة","الواجبات التي لم يحلها"]];
    cl.forEach(c => c.list.forEach(s => rows2.push([c.cls, s.name, s.a, s.d, s.miss, s.miss===0?"منجز":"غير منجز", (s.missed||[]).map(m => `${m.subj}: ${m.title}`).join(" | ")])));
    const ws2 = XLSX.utils.aoa_to_sheet(rows2); ws2["!cols"] = [{wch:12},{wch:34},{wch:14},{wch:10},{wch:12},{wch:10},{wch:120}]; ws2["!views"] = [{RTL:true}];
    XLSX.utils.book_append_sheet(wb, ws2, "حصر الطلاب");
  }
  const out = XLSX.write(wb, { bookType:"xlsx", type:"array" });
  await offerFile(`بيانات الواجبات - ${w.title||"أسبوع"}.xlsx`, new Blob([out]));
}

    try{ await saveSettings(o); S._settingsDirty = false; toast("تم حفظ الإعدادات"); render(); }catch(e){}
  };
  $("#bkExport").onclick = () => offerFile(`نسخة منصة الواجبات ${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify({ app:"sahafa-homework", version:1, settings:S.settings, teachers:S.teachers, weeks:S.weeks, rosters:S.rosters }, null, 2));
  $("#ghExport").onclick = async () => {
    const pw = $("#ghPw").value.trim();
    if(pw.length < 6){ toast("اكتب كلمة مرور الدخول (6 خانات على الأقل)"); return; }
    const btn = $("#ghExport"); btn.disabled = true; btn.textContent = "جارٍ التشفير…";
    try{
      const txt = await encryptData({ app:"sahafa-homework", version:1, settings:S.settings, teachers:S.teachers, weeks:S.weeks, rosters:S.rosters }, pw);
      await offerFile(DATA_FILE, txt);
    }catch(e){ console.error(e); toast("تعذّر إنشاء الملف"); }
    btn.disabled = false; btn.textContent = "تنزيل data.enc.json";
  };
  $("#bkImport").onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      if(!d || !Array.isArray(d.teachers) || !Array.isArray(d.weeks)) throw new Error("bad");
      for(const t of d.teachers) if(t && t.id && t.name) await saveDoc("teachers", t);
      for(const w of d.weeks) if(w && w.id && Array.isArray(w.rows)) await saveDoc("weeks", w);
      if(d.settings) await saveSettings({ ...S.settings, ...d.settings });
      if(d.rosters && S.mode === "db"){ for(const [k,v] of Object.entries(d.rosters)) await S.db.doc("config/" + k).set({ list:v }); }
      else if(d.rosters){ S.rosters = { ...S.rosters, ...d.rosters }; if(S.mode === "local") lsSave(); }
      toast("تم استيراد النسخة الاحتياطية"); render();
    }catch(err){ toast("الملف غير صالح"); }
  };
}

/* ---------------- boot ---------------- */
chartSetup();
initStore().then(() => { if(S.mode !== "file" && isAuthed()) showApp(); });
</script>
</body>
</html>
